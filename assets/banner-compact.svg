  </defs>
  <rect width="640" height="300" rx="24" fill="url(#background)"/>
  <g transform="translate(250 24)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="140" height="112" rx="14" stroke-width="6"/>
