<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title description">
  <title id="title">ConfigMgr OSD Disk Partition Layout</title>
  <desc id="description">A blue and teal banner showing a disk partition diagram and the PowerShell script name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f68"/>
